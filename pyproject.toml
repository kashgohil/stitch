[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "stitch-desktop"
version = "0.1.0"
description = "A desktop video assembler for long-form video."
requires-python = ">=3.12,<3.13"
dependencies = ["PySide6>=6.8,<7", "platformdirs>=4,<5"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/stitch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
